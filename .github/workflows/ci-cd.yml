name: CI/CD — End-to-End Deployment

# ─────────────────────────────────────────────────────────────────────────────
# Repo layout (single repo):
#   retail-store-sample-app/
#     src/                    ← application source + Dockerfiles
#     demo-eks-terraform/     ← EKS Terraform (copied from eks-course repo)
#
# Fully account-generic — zero hardcoded account IDs, bucket names, or role names.
# Everything is derived at runtime from the AWS credentials provided as inputs.
#
# Job order:
#   resolve-tag + bootstrap  (parallel)
#       └─► create-ecr       (AWS CLI — idempotent ECR repo creation)
#               ├─► build-services      (parallel — 5 app images)
#               └─► mirror-dependencies (parallel — 5 dependency images)
#                       └─► terraform  (EKS cluster + add-ons + Helm/kubectl app deploy)
#
# EKS add-ons (demo-eks-terraform/addons.tf) — installed and verified every apply:
#   vpc-cni, kube-proxy, eks-pod-identity-agent, eks-node-monitoring-agent,
#   amazon-cloudwatch-observability, fluent-bit (→ CloudWatch Logs), with IRSA roles.
#   Add-ons created outside Terraform (e.g. via the console) are adopted into
#   state automatically before plan.
#   Repository variable FLUENT_BIT_CLOUDWATCH_ENABLED=false turns off the
#   fluent-bit CloudWatch output (CloudWatch add-on log collection takes over).
#
# App delivery — Helm + Argo CD (demo-eks-terraform/argocd.tf):
#   Terraform installs Argo CD (Helm chart argo-cd) and an Argo CD Application
#   that syncs the Helm chart deploy/helm/retail-store from this repo/branch
#   into the "default" namespace (auto-sync, prune, self-heal). The private
#   ECR registry and image tag are passed as Helm values by Terraform.
#   Private repo? Add secret ARGOCD_REPO_TOKEN (read-only PAT for this repo).
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:

      # ── AWS credentials ─────────────────────────────────────────────────────
      aws_access_key_id:
        description: 'AWS Access Key ID (optional when repository secret exists)'
        required: false
        default: ''

      aws_secret_access_key:
        description: 'AWS Secret Access Key (optional when repository secret exists)'
        required: false
        default: ''

      aws_region:
        description: 'AWS Region'
        required: false
        default: 'us-east-1'

      root_domain:
        description: 'DNS suffix for the UI URL'
        required: false
        default: 'duckdns.org'

      app_subdomain:
        description: 'DuckDNS subdomain to use for the retail store UI'
        required: false
        default: 'abhayshreya'

      # ── OpenAI (optional) ────────────────────────────────────────────────────
      openai_api_key:
        description: 'OpenAI API Key (leave blank to disable AI chat in UI)'
        required: false
        default: ''

      # ── Pipeline options ─────────────────────────────────────────────────────
      action:
        description: 'Terraform action'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply
          - destroy

      image_tag:
        description: 'Docker image tag (leave blank → auto: sha-XXXXXXXX)'
        required: false
        default: ''

      skip_build:
        description: 'Skip building service images (re-use an already-pushed tag)'
        type: boolean
        required: false
        default: false

      skip_mirror:
        description: 'Skip mirroring third-party dependency images to ECR'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  TF_STATE_KEY: eks/terraform.tfstate
  TF_VERSION:   '1.10.0'   # 1.10+ supports native S3 locking — no DynamoDB needed
  TF_DIR:       demo-eks-terraform

# ═════════════════════════════════════════════════════════════════════════════
jobs:

  # ── 1. Resolve image tag ──────────────────────────────────────────────────
  resolve-tag:
    name: Resolve image tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="sha-$(echo '${{ github.sha }}' | cut -c1-8)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag → $TAG"

  # ── 2. Bootstrap: preflight checks + state backend ───────────────────────
  # - Derives ALL names from the live AWS account ID (no hardcoding).
  # - Auto-detects whether KodeKloud pre-created eksClusterRole so Terraform
  #   knows whether to create it or reuse it.
  bootstrap:
    name: Bootstrap & preflight
    runs-on: ubuntu-latest
    outputs:
      tf_state_bucket:    ${{ steps.derive.outputs.tf_state_bucket }}
      ecr_registry:       ${{ steps.derive.outputs.ecr_registry }}
      account_id:         ${{ steps.derive.outputs.account_id }}
      use_predefined_role: ${{ steps.derive.outputs.use_predefined_role }}
      cluster_name:       ${{ steps.derive.outputs.cluster_name }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ inputs.aws_access_key_id || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key || secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ inputs.aws_region }}

      - name: Derive all names from live account
        id: derive
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ inputs.aws_region }}"

          # All names derived — nothing hardcoded
          TF_BUCKET="retail-store-tfstate-${ACCOUNT_ID}"
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"
          CLUSTER_NAME="retail-store-eks"

          # This KodeKloud lab does not pre-create eksClusterRole, and the
          # lab IAM user has iam:CreateRole/DeleteRole/AttachRolePolicy.
          # Auto-detecting role existence flipped between runs (absent → false
          # on run 1, present → true on run 2) and caused a destructive replan,
          # so we pin it to false. Override here if a future lab predefines the role.
          USE_PREDEFINED="false"
          echo "use_predefined_role pinned to false (lab creates the role itself)"

          echo "account_id=$ACCOUNT_ID"           >> "$GITHUB_OUTPUT"
          echo "tf_state_bucket=$TF_BUCKET"       >> "$GITHUB_OUTPUT"
          echo "ecr_registry=$ECR_REGISTRY"       >> "$GITHUB_OUTPUT"
          echo "cluster_name=$CLUSTER_NAME"       >> "$GITHUB_OUTPUT"
          echo "use_predefined_role=$USE_PREDEFINED" >> "$GITHUB_OUTPUT"

          echo "Account       : $ACCOUNT_ID"
          echo "State bucket  : $TF_BUCKET"
          echo "ECR registry  : $ECR_REGISTRY"
          echo "Cluster name  : $CLUSTER_NAME"
          echo "Predefined role: $USE_PREDEFINED"

      - name: Ensure S3 state bucket exists
        run: |
          BUCKET="${{ steps.derive.outputs.tf_state_bucket }}"
          REGION="${{ inputs.aws_region }}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket already exists."
          else
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration \
                '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration \
                BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            echo "Bucket created."
          fi

      # No DynamoDB needed — Terraform 1.10+ uses native S3 locking (use_lockfile=true)

  # ── 3. Create ECR repositories via AWS CLI ───────────────────────────────
  # Idempotent. ECR managed here (not in Terraform) so builds can push images
  # before the EKS cluster is created.
  create-ecr:
    name: Create ECR repositories
    runs-on: ubuntu-latest
    needs: [bootstrap]
    if: ${{ inputs.action != 'destroy' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ inputs.aws_access_key_id || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key || secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ inputs.aws_region }}

      - name: Ensure all ECR repositories exist
        run: |
          REGION="${{ inputs.aws_region }}"
          REPOS=(
            retail-store-sample-ui
            retail-store-sample-catalog
            retail-store-sample-cart
            retail-store-sample-checkout
            retail-store-sample-orders
            retail-store-sample-mysql
            retail-store-sample-postgres
            retail-store-sample-rabbitmq
            retail-store-sample-dynamodb-local
            retail-store-sample-redis
          )
          for REPO in "${REPOS[@]}"; do
            if aws ecr describe-repositories --repository-names "$REPO" \
                 --region "$REGION" --no-cli-pager 2>/dev/null; then
              echo "$REPO — already exists"
            else
              aws ecr create-repository \
                --repository-name "$REPO" \
                --image-tag-mutability MUTABLE \
                --image-scanning-configuration scanOnPush=true \
                --region "$REGION" --no-cli-pager
              echo "$REPO — created"
            fi
          done

  # ── 4. Mirror third-party dependency images ───────────────────────────────
  mirror-dependencies:
    name: Mirror ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [resolve-tag, create-ecr]
    if: ${{ inputs.skip_mirror != true && inputs.action != 'destroy' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mysql,          source: "mysql:8.0",                    repo: retail-store-sample-mysql,          tag: "8.0"        }
          - { name: postgres,       source: "postgres:16.1",                repo: retail-store-sample-postgres,       tag: "16.1"       }
          - { name: rabbitmq,       source: "rabbitmq:3-management",        repo: retail-store-sample-rabbitmq,       tag: 3-management }
          - { name: dynamodb-local, source: "amazon/dynamodb-local:1.25.1", repo: retail-store-sample-dynamodb-local, tag: "1.25.1"     }
          - { name: redis,          source: "redis:6.0-alpine",             repo: retail-store-sample-redis,          tag: 6.0-alpine   }
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ inputs.aws_access_key_id || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key || secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ inputs.aws_region }}

      - name: Login to private ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull, retag and push ${{ matrix.name }}
        run: |
          DEST="${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}"
          docker pull ${{ matrix.source }}
          docker tag  ${{ matrix.source }} "${DEST}:${{ matrix.tag }}"
          docker tag  ${{ matrix.source }} "${DEST}:latest"
          docker push "${DEST}:${{ matrix.tag }}"
          docker push "${DEST}:latest"

  # ── 5. Build and push application service images ──────────────────────────
  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [resolve-tag, create-ecr]
    if: ${{ inputs.skip_build != true && inputs.action != 'destroy' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: ui,       context: src/ui,       repo: retail-store-sample-ui       }
          - { service: catalog,  context: src/catalog,  repo: retail-store-sample-catalog  }
          - { service: cart,     context: src/cart,     repo: retail-store-sample-cart     }
          - { service: checkout, context: src/checkout, repo: retail-store-sample-checkout }
          - { service: orders,   context: src/orders,   repo: retail-store-sample-orders   }
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ inputs.aws_access_key_id || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key || secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ inputs.aws_region }}

      - name: Login to private ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context:    ${{ matrix.context }}
          push:       true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:${{ needs.resolve-tag.outputs.image_tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:latest
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:cache
          cache-to:   type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:cache,mode=max

  # ── 6. Terraform static checks ───────────────────────────────────────────
  terraform-checks:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ${{ env.TF_DIR }}

      - name: Terraform Init Without Backend
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate -no-color

      - name: Install Helm
        uses: azure/setup-helm@v4

      # Render the chart with the same value shape Terraform passes via Argo CD
      - name: Helm lint & template retail-store chart
        run: |
          CHART=deploy/helm/retail-store
          cat > ci-values.yaml <<'EOF'
          image:
            registry: 000000000000.dkr.ecr.us-east-1.amazonaws.com
            tag: sha-test
          ingress:
            host: example.duckdns.org
            certificateArn: arn:aws:acm:us-east-1:000000000000:certificate/test
            cognitoAuthConfig: '{"userPoolARN":"arn","userPoolClientID":"id","userPoolDomain":"d"}'
          ui:
            authLogoutUrl: https://example.auth.us-east-1.amazoncognito.com/logout?client_id=x&scope=openid+email
          EOF
          helm lint "$CHART" -f ci-values.yaml
          helm template retail-store "$CHART" -f ci-values.yaml > rendered.yaml
          echo "Rendered $(grep -c '^kind:' rendered.yaml) objects"
          grep 'image:' rendered.yaml

  # ── 7. Terraform — EKS cluster + deploy app ──────────────────────────────
  # Uses demo-eks-terraform/ (committed in this repo) — no external repo clone needed.
  # Patches retail-store.yaml.tftpl image URLs with private ECR before apply.
  # All Terraform vars are passed explicitly — no variable defaults relied upon.
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    env:
      DUCKDNS_POLLING_INTERVAL: '5'
      DUCKDNS_PROPAGATION_TIMEOUT: '180'
      DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || inputs.openai_api_key }}
      TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY || inputs.openai_api_key }}
      # Same values as the explicit -var flags below; set as env too so that
      # `terraform import` (add-on adoption step) sees an identical config.
      TF_VAR_aws_region:          ${{ inputs.aws_region }}
      TF_VAR_cluster_name:        ${{ needs.bootstrap.outputs.cluster_name }}
      TF_VAR_root_domain:         ${{ inputs.root_domain }}
      TF_VAR_app_subdomain:       ${{ inputs.app_subdomain }}
      TF_VAR_use_predefined_role: ${{ needs.bootstrap.outputs.use_predefined_role }}
      # fluent-bit → CloudWatch Logs (repository variable; default on)
      TF_VAR_fluent_bit_cloudwatch_enabled: ${{ vars.FLUENT_BIT_CLOUDWATCH_ENABLED || 'true' }}
      # CloudWatch Application Signals auto-instrumentation (repository variable; default off, it slows JVM startup)
      TF_VAR_cloudwatch_application_signals_enabled: ${{ vars.CLOUDWATCH_APPLICATION_SIGNALS_ENABLED || 'false' }}
      # Argo CD / Helm: images for the retail-store chart and the Git source
      # Argo CD syncs from (this repo, the branch the pipeline runs on).
      TF_VAR_image_registry:          ${{ needs.bootstrap.outputs.ecr_registry }}
      TF_VAR_image_tag:               ${{ needs.resolve-tag.outputs.image_tag }}
      TF_VAR_gitops_repo_url:         ${{ github.server_url }}/${{ github.repository }}.git
      TF_VAR_gitops_target_revision:  ${{ github.ref_name }}
      # Only needed when the repo is private: a fine-grained PAT with
      # Contents: read-only on this repo, stored as secret ARGOCD_REPO_TOKEN.
      TF_VAR_gitops_repo_token:       ${{ secrets.ARGOCD_REPO_TOKEN }}
    needs:
      - resolve-tag
      - bootstrap
      - create-ecr
      - build-services
      - mirror-dependencies
      - terraform-checks
    if: |
      always() &&
      needs.bootstrap.result == 'success' &&
      needs.terraform-checks.result == 'success' &&
      (needs.create-ecr.result          == 'success' || needs.create-ecr.result          == 'skipped') &&
      (needs.build-services.result      == 'success' || needs.build-services.result      == 'skipped') &&
      (needs.mirror-dependencies.result == 'success' || needs.mirror-dependencies.result == 'skipped')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ inputs.aws_access_key_id || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key || secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ inputs.aws_region }}

      - name: Verify DuckDNS configuration
        run: |
          if [ -z "$DUCKDNS_TOKEN" ]; then
            echo "Repository secret DUCKDNS_TOKEN is required."
            exit 1
          fi
          if [ "${{ inputs.root_domain }}" != "duckdns.org" ]; then
            echo "root_domain must be duckdns.org."
            exit 1
          fi

      # Images are no longer patched into a manifest: the private ECR registry and
      # image tag reach the retail-store Helm chart through the Argo CD Application
      # (TF_VAR_image_registry / TF_VAR_image_tag above).
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ needs.bootstrap.outputs.tf_state_bucket }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" \
            -lockfile=readonly \
            -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      # EKS add-ons that already exist on the cluster but not in Terraform state
      # (e.g. installed from the console) would make CreateAddon fail with
      # "already exists". Import them so Terraform takes ownership and fixes
      # their config/IRSA role; add-ons stuck in a *_FAILED state are deleted
      # so Terraform can create them cleanly.
      - name: Adopt EKS add-ons created outside Terraform
        if: ${{ inputs.action != 'destroy' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          CLUSTER="${{ needs.bootstrap.outputs.cluster_name }}"
          REGION="${{ inputs.aws_region }}"

          if ! aws eks describe-cluster --name "$CLUSTER" --region "$REGION" >/dev/null 2>&1; then
            echo "Cluster $CLUSTER does not exist yet — nothing to adopt."
            exit 0
          fi

          STATE=$(terraform state list 2>/dev/null || true)

          declare -A ADDONS=(
            [vpc-cni]=vpc_cni
            [kube-proxy]=kube_proxy
            [eks-pod-identity-agent]=pod_identity_agent
            [eks-node-monitoring-agent]=node_monitoring_agent
            [amazon-cloudwatch-observability]=cloudwatch_observability
            [fluent-bit]=fluent_bit
          )

          # A failed add-on (e.g. CREATE_FAILED) is normally deleted and recreated.
          # The KodeKloud lab user may not have eks:DeleteAddon, so fall back to
          # retrying the install in place with UpdateAddon, then clear the taint so
          # Terraform does not try to delete/recreate it.
          recover_addon() {
            local NAME="$1" ADDR="$2" IN_STATE="$3"
            echo "✗ $NAME is $STATUS — trying DeleteAddon so Terraform can recreate it"
            if aws eks delete-addon --cluster-name "$CLUSTER" --addon-name "$NAME" \
                 --region "$REGION" >/dev/null 2>delete.err; then
              aws eks wait addon-deleted --cluster-name "$CLUSTER" --addon-name "$NAME" --region "$REGION"
              if [ "$IN_STATE" = 1 ]; then terraform state rm "$ADDR"; fi
              echo "  deleted — Terraform will create it again"
              return 0
            fi
            cat delete.err

            echo "  DeleteAddon not permitted — retrying the install in place with UpdateAddon"
            if aws eks update-addon --cluster-name "$CLUSTER" --addon-name "$NAME" \
                 --resolve-conflicts OVERWRITE --region "$REGION" >/dev/null 2>update.err; then
              if aws eks wait addon-active --cluster-name "$CLUSTER" --addon-name "$NAME" --region "$REGION"; then
                if [ "$IN_STATE" = 1 ]; then
                  terraform untaint "$ADDR" 2>/dev/null || true
                else
                  terraform import -input=false "$ADDR" "${CLUSTER}:${NAME}"
                fi
                echo "  $NAME recovered in place and is ACTIVE"
                return 0
              fi
              aws eks describe-addon --cluster-name "$CLUSTER" --addon-name "$NAME" --region "$REGION" \
                --query "addon.health.issues" --output table || true
            else
              cat update.err
            fi

            echo "::error::$NAME is stuck in $STATUS and this IAM user can neither delete nor update it."
            return 1
          }

          FAILED=0
          for NAME in "${!ADDONS[@]}"; do
            ADDR="aws_eks_addon.${ADDONS[$NAME]}"
            IN_STATE=0
            if grep -qx "$ADDR" <<<"$STATE"; then IN_STATE=1; fi

            STATUS=$(aws eks describe-addon --cluster-name "$CLUSTER" --addon-name "$NAME" \
              --region "$REGION" --query "addon.status" --output text 2>/dev/null || echo "NONE")

            case "$STATUS" in
              NONE)
                echo "• $NAME not installed — Terraform will create it"
                ;;
              CREATE_FAILED|DELETE_FAILED)
                recover_addon "$NAME" "$ADDR" "$IN_STATE" || FAILED=1
                ;;
              *)
                if [ "$IN_STATE" = 1 ]; then
                  # Healthy on the cluster but tainted by an earlier failed apply:
                  # keep it instead of letting Terraform delete/recreate it.
                  if terraform state show "$ADDR" 2>/dev/null | head -1 | grep -q tainted; then
                    echo "↺ $NAME is $STATUS but tainted in state — untainting"
                    terraform untaint "$ADDR"
                  else
                    echo "✓ $NAME already managed by Terraform ($STATUS)"
                  fi
                else
                  echo "→ $NAME exists ($STATUS) outside Terraform — importing into $ADDR"
                  terraform import -input=false "$ADDR" "${CLUSTER}:${NAME}"
                fi
                ;;
            esac
          done

          exit $FAILED

      # All vars passed explicitly — no defaults relied on from variables.tf
      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "Argo CD source: ${{ github.server_url }}/${{ github.repository }}.git @ ${{ github.ref_name }}"
          terraform plan \
            -var="aws_region=${{ inputs.aws_region }}" \
            -var="cluster_name=${{ needs.bootstrap.outputs.cluster_name }}" \
            -var="root_domain=${{ inputs.root_domain }}" \
            -var="app_subdomain=${{ inputs.app_subdomain }}" \
            -var="use_predefined_role=${{ needs.bootstrap.outputs.use_predefined_role }}" \
            -var="gitops_repo_url=${{ github.server_url }}/${{ github.repository }}.git" \
            -var="gitops_target_revision=${{ github.ref_name }}" \
            -var="image_registry=${{ needs.bootstrap.outputs.ecr_registry }}" \
            -var="image_tag=${{ needs.resolve-tag.outputs.image_tag }}" \
            -out=tfplan \
            -input=false

      - name: Plan summary
        if: always()
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "### Terraform Plan" >> $GITHUB_STEP_SUMMARY
          terraform show -no-color tfplan 2>/dev/null | tail -40 >> $GITHUB_STEP_SUMMARY || true

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -input=false tfplan

      - name: Publish current ALB IP to DuckDNS
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          ALB_DNS=$(terraform output -raw ui_alb_dns_name)
          ALB_IP=""

          for attempt in $(seq 1 30); do
            ALB_IP=$(curl --silent --show-error --output /dev/null \
              --connect-timeout 10 --max-time 15 \
              --write-out '%{remote_ip}' "http://${ALB_DNS}/" || true)
            if [[ "$ALB_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              break
            fi
            echo "Waiting for the ALB DNS name to resolve ($attempt/30)..."
            ALB_IP=""
            sleep 10
          done

          if [ -z "$ALB_IP" ]; then
            echo "Could not resolve an IPv4 address for $ALB_DNS"
            exit 1
          fi

          RESPONSE=$(curl --fail --silent --show-error --get \
            --data-urlencode "domains=${{ inputs.app_subdomain }}" \
            --data-urlencode "token=$DUCKDNS_TOKEN" \
            --data-urlencode "ip=$ALB_IP" \
            --data-urlencode "verbose=true" \
            https://www.duckdns.org/update)

          if [[ "$RESPONSE" != OK* ]]; then
            echo "DuckDNS update failed: $RESPONSE"
            exit 1
          fi

          echo "DuckDNS now points to ALB address $ALB_IP"

      - name: Clear DuckDNS record before destroy
        if: ${{ inputs.action == 'destroy' }}
        run: |
          RESPONSE=$(curl --fail --silent --show-error --get \
            --data-urlencode "domains=${{ inputs.app_subdomain }}" \
            --data-urlencode "token=$DUCKDNS_TOKEN" \
            --data-urlencode "clear=true" \
            https://www.duckdns.org/update)

          if [[ "$RESPONSE" != OK* ]]; then
            echo "DuckDNS clear failed: $RESPONSE"
            exit 1
          fi

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform destroy \
            -var="aws_region=${{ inputs.aws_region }}" \
            -var="cluster_name=${{ needs.bootstrap.outputs.cluster_name }}" \
            -var="root_domain=${{ inputs.root_domain }}" \
            -var="app_subdomain=${{ inputs.app_subdomain }}" \
            -var="use_predefined_role=${{ needs.bootstrap.outputs.use_predefined_role }}" \
            -var="gitops_repo_url=${{ github.server_url }}/${{ github.repository }}.git" \
            -var="gitops_target_revision=${{ github.ref_name }}" \
            -var="image_registry=${{ needs.bootstrap.outputs.ecr_registry }}" \
            -var="image_tag=${{ needs.resolve-tag.outputs.image_tag }}" \
            -auto-approve \
            -input=false

      - name: Update kubeconfig
        if: ${{ inputs.action == 'apply' }}
        run: |
          CLUSTER="${{ needs.bootstrap.outputs.cluster_name }}"
          aws eks update-kubeconfig --region "${{ inputs.aws_region }}" --name "$CLUSTER"

      - name: Configure recurring DuckDNS ALB sync
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          ALB_DNS=$(terraform output -raw ui_alb_dns_name)
          SYNC_IMAGE="${{ needs.bootstrap.outputs.ecr_registry }}/retail-store-sample-ui:${{ needs.resolve-tag.outputs.image_tag }}"

          kubectl create secret generic duckdns-sync -n default \
            --from-literal=DUCKDNS_TOKEN="$DUCKDNS_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create cronjob duckdns-sync -n default \
            --schedule='*/5 * * * *' \
            --image="$SYNC_IMAGE" \
            --dry-run=client -o yaml \
            -- /bin/sh -ec '
              ALB_IP=$(curl --silent --show-error --output /dev/null \
                --connect-timeout 10 --max-time 15 \
                --write-out "%{remote_ip}" "http://${ALB_DNS}/")
              case "$ALB_IP" in
                ""|*[!0-9.]*) echo "Invalid ALB IPv4 address: $ALB_IP"; exit 1 ;;
              esac
              RESPONSE=$(curl --fail --silent --show-error --get \
                --data-urlencode "domains=${DUCKDNS_DOMAIN}" \
                --data-urlencode "token=${DUCKDNS_TOKEN}" \
                --data-urlencode "ip=${ALB_IP}" \
                --data-urlencode "verbose=true" \
                https://www.duckdns.org/update)
              case "$RESPONSE" in
                OK*) echo "DuckDNS points to ALB address $ALB_IP" ;;
                *) echo "DuckDNS update failed: $RESPONSE"; exit 1 ;;
              esac
            ' | kubectl apply -f -

          kubectl set env cronjob/duckdns-sync -n default \
            ALB_DNS="$ALB_DNS" \
            DUCKDNS_DOMAIN="${{ inputs.app_subdomain }}"
          kubectl set env cronjob/duckdns-sync -n default --from=secret/duckdns-sync
          kubectl patch cronjob duckdns-sync -n default --type=merge \
            --patch='{"spec":{"concurrencyPolicy":"Forbid","successfulJobsHistoryLimit":1,"failedJobsHistoryLimit":2}}'

      # Pods created while Application Signals auto-monitoring was on keep the
      # injected OpenTelemetry agent until restarted. Restart only those.
      - name: Remove injected Application Signals agents
        if: ${{ inputs.action == 'apply' && env.TF_VAR_cloudwatch_application_signals_enabled != 'true' }}
        run: |
          INSTRUMENTED=$(kubectl get pods -n default -o json | jq -r '
            .items[]
            | select(any(.spec.initContainers[]?; .name | startswith("opentelemetry-auto-instrumentation")))
            | .metadata.ownerReferences[0] | "\(.kind)/\(.name)"' | sort -u)
          if [ -z "$INSTRUMENTED" ]; then
            echo "No pods carry the Application Signals agent."
            exit 0
          fi
          for OWNER in $INSTRUMENTED; do
            case "$OWNER" in
              ReplicaSet/*)
                RS=${OWNER#ReplicaSet/}
                DEPLOY=$(kubectl get rs "$RS" -n default -o jsonpath='{.metadata.ownerReferences[0].name}')
                echo "Restarting deployment/$DEPLOY"
                kubectl rollout restart deployment/"$DEPLOY" -n default ;;
              StatefulSet/*)
                echo "Restarting ${OWNER,,}"
                kubectl rollout restart "${OWNER,,}" -n default ;;
            esac
          done

      - name: Wait for UI deployment
        if: ${{ inputs.action == 'apply' }}
        run: |
          if kubectl rollout status deployment/ui -n default --timeout=20m; then
            exit 0
          fi

          echo "::group::Pods in default namespace"
          kubectl get pods -n default -o wide || true
          echo "::endgroup::"
          echo "::group::ui pod details"
          kubectl describe pod -n default -l app.kubernetes.io/name=ui,app.kubernetes.io/component=service | tail -60 || true
          echo "::endgroup::"
          echo "::group::ui logs"
          kubectl logs -n default deployment/ui --tail=80 --all-containers || true
          echo "::endgroup::"
          echo "::group::Node capacity"
          kubectl describe nodes | grep -A8 "Allocated resources" || true
          echo "::endgroup::"
          echo "::group::Argo CD application"
          kubectl -n argocd get application retail-store -o wide || true
          echo "::endgroup::"
          exit 1

      - name: Verify Argo CD application
        if: ${{ inputs.action == 'apply' }}
        run: |
          APP=retail-store
          kubectl get pods -n argocd

          for attempt in $(seq 1 60); do
            SYNC=$(kubectl -n argocd get application "$APP" -o jsonpath='{.status.sync.status}')
            HEALTH=$(kubectl -n argocd get application "$APP" -o jsonpath='{.status.health.status}')
            REV=$(kubectl -n argocd get application "$APP" -o jsonpath='{.status.sync.revision}')
            echo "sync=$SYNC health=$HEALTH revision=$REV ($attempt/60)"
            if [ "$SYNC" = "Synced" ] && [ "$HEALTH" = "Healthy" ]; then
              break
            fi
            sleep 10
          done

          echo "### Argo CD" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Application | ${APP} (namespace argocd) |" >> $GITHUB_STEP_SUMMARY
          echo "| Source | \`${TF_VAR_gitops_repo_url}\` @ \`${TF_VAR_gitops_target_revision}\` / \`deploy/helm/retail-store\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Sync / Health | ${SYNC} / ${HEALTH} |" >> $GITHUB_STEP_SUMMARY
          echo "| Revision | ${REV} |" >> $GITHUB_STEP_SUMMARY
          echo "| UI access | \`kubectl port-forward svc/argocd-server -n argocd 8080:80\` → http://localhost:8080 (user \`admin\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| Admin password | \`kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' \| base64 -d\` |" >> $GITHUB_STEP_SUMMARY

          if [ "$SYNC" != "Synced" ] || [ "$HEALTH" != "Healthy" ]; then
            echo "Argo CD application is not Synced/Healthy:"
            kubectl -n argocd get application "$APP" -o jsonpath='{range .status.conditions[*]}{.type}: {.message}{"\n"}{end}'
            kubectl -n argocd get application "$APP" -o json | jq -r '.status.resources[]? | select(.health.status? and .health.status != "Healthy") | "\(.kind)/\(.name): \(.health.status) \(.health.message // "")"'
            exit 1
          fi

      - name: Deployment summary
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          CLUSTER="${{ needs.bootstrap.outputs.cluster_name }}"
          UI_URL=$(terraform output -raw ui_url 2>/dev/null || echo "pending")
          ALB_DNS=$(terraform output -raw ui_alb_dns_name 2>/dev/null || echo "pending")
          USER_POOL_ID=$(terraform output -raw cognito_user_pool_id 2>/dev/null || echo "pending")
          USER_POOL_CLIENT_ID=$(terraform output -raw cognito_user_pool_client_id 2>/dev/null || echo "pending")
          COGNITO_LOGIN_DOMAIN=$(terraform output -raw cognito_login_domain 2>/dev/null || echo "pending")
          CURRENT_IP=$(curl --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 15 \
            --write-out '%{remote_ip}' "http://${ALB_DNS}/" 2>/dev/null || echo "pending")

          echo "### Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| AWS Account  | ${{ needs.bootstrap.outputs.account_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag    | ${{ needs.resolve-tag.outputs.image_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ECR Registry | ${{ needs.bootstrap.outputs.ecr_registry }} |" >> $GITHUB_STEP_SUMMARY
          echo "| EKS Cluster  | ${CLUSTER} |" >> $GITHUB_STEP_SUMMARY
          echo "| UI URL       | ${UI_URL} |" >> $GITHUB_STEP_SUMMARY
          echo "| ALB DNS      | ${ALB_DNS} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cognito Pool | ${USER_POOL_ID} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cognito App Client | ${USER_POOL_CLIENT_ID} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cognito Login Domain | ${COGNITO_LOGIN_DOMAIN} |" >> $GITHUB_STEP_SUMMARY
          echo "| Current ALB IP in DuckDNS | ${CURRENT_IP} |" >> $GITHUB_STEP_SUMMARY
          echo "| DuckDNS Sync | Kubernetes CronJob every 5 minutes |" >> $GITHUB_STEP_SUMMARY

      # ── EKS add-on health ────────────────────────────────────────────────
      # Runs last so a slow add-on never blocks the app deploy / DuckDNS steps,
      # but still fails the run if any add-on is not healthy.
      - name: Verify EKS add-ons
        if: ${{ inputs.action == 'apply' }}
        run: |
          CLUSTER="${{ needs.bootstrap.outputs.cluster_name }}"
          REGION="${{ inputs.aws_region }}"
          ADDONS="vpc-cni kube-proxy eks-pod-identity-agent eks-node-monitoring-agent amazon-cloudwatch-observability fluent-bit"

          # Wait up to 10 minutes for every add-on to report ACTIVE
          for attempt in $(seq 1 60); do
            PENDING=""
            for NAME in $ADDONS; do
              STATUS=$(aws eks describe-addon --cluster-name "$CLUSTER" --addon-name "$NAME" \
                --region "$REGION" --query 'addon.status' --output text 2>/dev/null || echo "MISSING")
              [ "$STATUS" = "ACTIVE" ] || PENDING="$PENDING $NAME($STATUS)"
            done
            [ -z "$PENDING" ] && break
            echo "Waiting for add-ons ($attempt/60):$PENDING"
            sleep 10
          done

          FAILED=0
          echo "### EKS Add-ons" >> $GITHUB_STEP_SUMMARY
          echo "| Add-on | Version | Status | IRSA role | Health issues |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          # IRSA roles are bound via service-account annotations (lab user has no
          # iam:PassRole, so add-ons carry no serviceAccountRoleArn)
          declare -A IRSA_SA=(
            [vpc-cni]=kube-system/aws-node
            [amazon-cloudwatch-observability]=amazon-cloudwatch/cloudwatch-agent
            [fluent-bit]=fluent-bit/fluent-bit
          )

          for NAME in $ADDONS; do
            read -r STATUS VERSION <<<"$(aws eks describe-addon --cluster-name "$CLUSTER" --addon-name "$NAME" \
              --region "$REGION" --query 'addon.[status,addonVersion]' --output text 2>/dev/null || echo "MISSING -")"
            ROLE="none"
            if [ -n "${IRSA_SA[$NAME]:-}" ]; then
              SA_NS="${IRSA_SA[$NAME]%%/*}"
              SA_NAME="${IRSA_SA[$NAME]##*/}"
              ROLE=$(kubectl get serviceaccount "$SA_NAME" -n "$SA_NS" \
                -o jsonpath='{.metadata.annotations.eks\.amazonaws\.com/role-arn}' 2>/dev/null || true)
              if [ -z "$ROLE" ]; then
                echo "✗ $NAME: service account $SA_NS/$SA_NAME has no IRSA role annotation"
                ROLE="MISSING"
                FAILED=1
              fi
            fi
            ISSUES=$(aws eks describe-addon --cluster-name "$CLUSTER" --addon-name "$NAME" --region "$REGION" \
              --query 'addon.health.issues[].[code,message]' --output text 2>/dev/null | tr '\t\n' ': ' || true)
            echo "| $NAME | $VERSION | $STATUS | ${ROLE##*/} | ${ISSUES:-none} |" >> $GITHUB_STEP_SUMMARY
            echo "$NAME: $STATUS $VERSION ${ISSUES}"
            [ "$STATUS" = "ACTIVE" ] || FAILED=1
          done

          echo "--- Add-on workloads ---"
          kubectl get daemonsets -n kube-system
          kubectl get pods -n amazon-cloudwatch -o wide || true
          kubectl get pods -n fluent-bit -o wide || true

          if [ "$FAILED" -ne 0 ]; then
            echo "One or more EKS add-ons are not ACTIVE — see the table in the run summary."
            exit 1
          fi

      - name: Verify fluent-bit → CloudWatch Logs
        if: ${{ inputs.action == 'apply' && env.TF_VAR_fluent_bit_cloudwatch_enabled == 'true' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          REGION="${{ inputs.aws_region }}"
          APP_GROUP=$(terraform output -json fluent_bit_log_groups | jq -r '.[0] // empty')
          if [ -z "$APP_GROUP" ]; then
            echo "fluent-bit CloudWatch output disabled — nothing to verify."
            exit 0
          fi

          DS=$(kubectl get daemonset -n fluent-bit -o name | head -1)
          if [ -z "$DS" ]; then
            echo "No fluent-bit DaemonSet found in namespace fluent-bit"
            exit 1
          fi
          kubectl rollout status "$DS" -n fluent-bit --timeout=5m

          # fluent-bit creates the log group on the first shipped log line
          for attempt in $(seq 1 30); do
            FOUND=$(aws logs describe-log-groups --region "$REGION" \
              --log-group-name-prefix "$APP_GROUP" \
              --query "logGroups[?logGroupName=='${APP_GROUP}'].logGroupName" --output text)
            if [ "$FOUND" = "$APP_GROUP" ]; then
              STREAMS=$(aws logs describe-log-streams --region "$REGION" --log-group-name "$APP_GROUP" \
                --query 'length(logStreams)' --output text)
              echo "✓ $APP_GROUP exists with $STREAMS log stream(s)"
              echo "### fluent-bit → CloudWatch Logs" >> $GITHUB_STEP_SUMMARY
              echo "Log group \`$APP_GROUP\` receiving logs ($STREAMS streams)" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            echo "Waiting for $APP_GROUP ($attempt/30)..."
            sleep 10
          done

          echo "Log group $APP_GROUP was not created within 5 minutes. fluent-bit logs:"
          kubectl logs "$DS" -n fluent-bit --tail=100 || true
          echo "If the add-on rejected the output config, set repository variable FLUENT_BIT_CLOUDWATCH_ENABLED=false and re-run."
          exit 1
