<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:fragment="layout (template, menu)"
  th:replace="~{fragments/bare :: bare (~{::body})}"
>
  <body>
    <!-- Navigation -->
    <nav class="bg-white">
      <div class="max-w-6xl mx-auto px-4">
        <div class="flex justify-between items-center h-16">
          <a th:href="@{/}">
            <div class="flex items-center">
              <i class="fas fa-briefcase text-2xl text-primary-500"></i>
              <span class="ml-2 text-xl text-gray-800">&nbsp;</span>
            </div>
          </a>
          <div class="flex items-center space-x-3 sm:space-x-8 lg:space-x-12">
            <a
              id="menu-home"
              th:href="@{/}"
              class="hover:text-primary-500 transition duration-300 text-sm"
              th:text="#{nav.home}"
              >Home</a
            >
            <a
              id="menu-catalog"
              th:href="@{/catalog}"
              class="hover:text-primary-500 transition duration-300 text-sm"
              th:text="#{nav.catalog}"
              >Catalog</a
            >
          </div>
          <div class="flex items-center gap-2 sm:gap-3">
            <div
              th:if="${authenticatedUsername != null}"
              class="flex items-center gap-1.5 text-gray-600"
              th:title="${authenticatedUsername}"
            >
              <i class="fas fa-circle-user text-base"></i>
              <span
                class="max-w-[5.5rem] sm:max-w-[10rem] truncate text-xs sm:text-sm"
                th:text="${authenticatedUsername}"
                >agent@example.com</span
              >
            </div>
            <a
              th:if="${authenticatedUsername != null}"
              th:href="@{/auth/logout}"
              class="inline-flex items-center gap-1.5 rounded-full border border-current px-2.5 py-1.5 text-xs text-gray-600 hover:text-primary-500 transition duration-300"
              title="Log out"
            >
              <i class="fas fa-arrow-right-from-bracket"></i>
              <span class="hidden sm:inline" th:text="#{nav.logout}"
                >Log out</span
              >
            </a>
            <!-- Cart Button with Count -->
            <a th:href="@{/cart}" id="go-cart">
              <button
                class="flex items-center gap-2 p-2 text-gray-700 hover:text-primary-500"
              >
                <i class="fas fa-shopping-cart text-lg"></i>
                <span
                  class="bg-primary-500 text-white text-xs rounded-full h-5 min-w-[1.25rem] flex items-center justify-center switch-other"
                  th:text="${cart.numItems}"
                >
                  3
                </span>
              </button>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content Area (can be filled with products) -->
    <main class="flex-grow">
      <!-- Content goes here -->
      <th:block th:insert="${template}" />
    </main>
  </body>
</html>
